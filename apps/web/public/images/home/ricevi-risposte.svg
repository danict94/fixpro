      Nuove risposte
    </text>
  </g>

  <!-- Connection lines -->
  <path d="M153 125C171 119 187 119 205 127" stroke="#DDE7F3" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 8"/>
  <path d="M204 142C190 151 172 151 154 142" stroke="#DDE7F3" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 8"/>
  <path d="M180 70V48" stroke="#DDE7F3" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 8"/>

  <!-- Small message indicators -->
  <g filter="url(#smallShadow)">
