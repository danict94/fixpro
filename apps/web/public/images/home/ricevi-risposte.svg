  </g>
  <circle cx="87" cy="191" r="6" fill="#10B981"/>
  <rect x="101" y="185" width="36" height="5" rx="2.5" fill="#64748B"/>
  <rect x="101" y="196" width="24" height="4.5" rx="2.25" fill="#CBD5E1"/>

  <g filter="url(#smallShadow)">
    <rect x="211" y="187" width="80" height="36" rx="18" fill="#FFFFFF"/>
  </g>
  <circle cx="229" cy="205" r="6" fill="#2563EB"/>
  <rect x="243" y="199" width="28" height="5" rx="2.5" fill="#64748B"/>
  <rect x="243" y="210" width="20" height="4.5" rx="2.25" fill="#CBD5E1"/>

  <!-- Decorative strokes -->
  <path d="M286 76C298 83 306 93 310 106" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 74C51 81 46 91 44 103" stroke="#86EFAC" stroke-width="4" stroke-linecap="round"/>
  <circle cx="255" cy="42" r="5" fill="#2563EB"/>
  <circle cx="95" cy="42" r="4" fill="#10B981"/>

  <defs>
    <filter id="mainShadow" x="83" y="48" width="194" height="176" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>

    <filter id="cardShadow" x="24" y="79" width="315" height="114" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <filter id="badgeShadow" x="108" y="18" width="144" height="74" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <filter id="smallShadow" x="52" y="162" width="255" height="77" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
  </defs>
</svg>