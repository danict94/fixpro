    <path d="M146.5 51H153.5" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M150 47.5V54.5" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
    <text
